[LangSwitch]
; play switch.wav / switch.mp3 after conversion (1/0)
Sound=1
; all = convert everything typed since last Enter/click/arrow key; word = only the last word
Scope=all
; switch the system layout after conversion (1/0)
SwitchLayout=1
; after converting a selection, select the new text again (so you can toggle back with Ctrl Ctrl)
Reselect=1
; max time between two Ctrl taps, ms
DoubleCtrlMs=500
; max number of remembered characters
MaxBuffer=1000
