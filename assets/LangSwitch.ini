[LangSwitch]
; play switch.wav / switch.mp3 after conversion (1/0)
Sound=1
; all = convert everything typed since last Enter/click/arrow key; word = only the last word
Scope=all
; switch the system layout after conversion (1/0)
SwitchLayout=1
; after converting a selection, select the new text again (so you can toggle back with Ctrl Ctrl)
Reselect=1
; double Ctrl with NO typed text just switches the layout RU<->EN (1/0)
SimpleSwitch=1
; how to replace typed text:
; auto   = select+paste ONLY in the browser address bar (Chrome/Edge/Firefox), backspace+type elsewhere
; always = select+paste everywhere (may break chats and web editors)
; never  = backspace+type everywhere
PasteMode=auto
; auto = in fullscreen borderless windows (games) keys are remembered only after a chat-open key was pressed
; off  = no special game handling
GameMode=auto
; keys that open the chat in games, separated by ';'  (ENTER or single letters/digits). Example: ENTER;T;Y
GameChatKeys=ENTER
; programs that are always treated as games (windowed games), separated by ';'. Example: game.exe
GameProcesses=
; programs where keys are ALWAYS remembered, no game/Explorer filtering. Example: chat.exe
ForceTrack=
; programs where LangSwitch does nothing at all (even double Ctrl). Example: game.exe
IgnoreProcesses=
; max time between two Ctrl taps, ms
DoubleCtrlMs=500
; max number of remembered characters
MaxBuffer=1000
