[LangSwitch]
; play switch.wav / switch.mp3 after conversion (1/0)
Sound=1
; all = convert everything typed since last Enter/click/arrow key; word = only the last word
Scope=all
; switch the system layout after conversion (1/0)
SwitchLayout=1
; after converting a selection, select the new text again (so you can toggle back with Ctrl Ctrl)
Reselect=1
; how to replace typed text:
; auto   = select+paste ONLY in the browser address bar (Chrome/Edge/Firefox), backspace+type elsewhere
; always = select+paste everywhere (may break chats and web editors)
; never  = backspace+type everywhere
PasteMode=auto
; auto   = remember typed keys only while focus is in a text field (not in games, Explorer file list, etc.)
; always = remember keys everywhere (old behaviour, use if some app is not detected)
TrackMode=auto
; programs that are ALWAYS tracked (e.g. a game with chat), separated by ';'  Example: ForceTrack=game.exe;chat.exe
ForceTrack=
; programs where LangSwitch does nothing at all (e.g. games where Ctrl is a game key). Example: IgnoreProcesses=game.exe
IgnoreProcesses=
; max time between two Ctrl taps, ms
DoubleCtrlMs=500
; max number of remembered characters
MaxBuffer=1000
