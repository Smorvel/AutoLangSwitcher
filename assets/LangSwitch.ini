[LangSwitch]
; play switch.wav / switch.mp3 after conversion (1/0)
Sound=1
; all = convert everything typed since last Enter/click/arrow key; word = only the last word
Scope=all
; switch the system layout after conversion (1/0)
SwitchLayout=1
; after converting a selection, select the new text again (so you can toggle back with Ctrl Ctrl)
Reselect=1
; game mode: in fullscreen windows and games with a hidden cursor only chat input is tracked (1/0)
GameFilter=1
; max time between two Ctrl taps, ms
DoubleCtrlMs=500
; max number of remembered characters
MaxBuffer=1000
; automatic layout switching of words typed in the wrong layout (1/0). Words.txt holds your own words
AutoSwitch=0
; double Ctrl switches the layout even when no text was typed (1/0)
SwitchEmpty=0
